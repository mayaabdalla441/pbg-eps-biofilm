[project]
# Distribution name matches the importable package (pbg_eps_biofilm), not the
# human-readable workspace name ("eps-biofilm", used separately in
# workspace.yaml / the workspace catalog). vivarium-workbench's composite
# discovery falls back to guessing the import name from the distribution name
# (hyphens -> underscores) whenever an editable install has no top_level.txt
# — a mismatch here (it used to be "eps-biofilm" -> "eps_biofilm") makes that
# guess wrong and this workspace's own @composite_generator entries silently
# fail to register in any fresh subprocess (e.g. every dashboard study run).
name = "pbg-eps-biofilm"
version = "0.0.0"
description = "Process-bigraph research workspace"
requires-python = ">=3.11"
dependencies = [
    "process-bigraph",
    "bigraph-schema",
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "matplotlib",
    "plotly",
    # Web-based workspace dashboard (server + templates + assets + lib helpers).
    # Extracted from pbg-template as of v0.4.16; provides the `vivarium-workbench
    # serve` CLI invoked by scripts/serve.sh.
    "vivarium-workbench",
    "spatio_flux",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Allow ecosystem git-direct-reference deps (pbg-superpowers / vivarium-workbench
# @ git+https://…) that workspaces commonly add — hatchling rejects them otherwise.
[tool.hatch.metadata]
allow-direct-references = true

# Declare the workspace Python package explicitly so this workspace is
# pip-installable (e.g. `pip install git+<repo>@<sha>`).  sms-api injects it
# as an extra_pip_dep so the container runner can import the workspace's
# processes from a committed + pushed git ref.
[tool.hatch.build.targets.wheel]
packages = ["pbg_eps_biofilm"]

[tool.uv.sources]
spatio_flux = { path = "external/spatio-flux", editable = true }
vivarium-workbench = { git = "https://github.com/vivarium-collective/vivarium-workbench.git", branch = "main" }
